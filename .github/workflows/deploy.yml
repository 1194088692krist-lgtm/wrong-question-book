name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker + D1 + R2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply wrong-question-book-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler.toml 中的 D1/R2 绑定会自动生效
          # 需在 GitHub 仓库 Settings → Secrets 中配置：
          #   CLOUDFLARE_API_TOKEN    - Cloudflare API 令牌（需 Workers 编辑、D1 编辑、R2 编辑权限）
          #   CLOUDFLARE_ACCOUNT_ID  - Cloudflare 账户 ID
          command: deploy
          preCommands: npx wrangler r2 bucket create wrong-question-book-assets || true
